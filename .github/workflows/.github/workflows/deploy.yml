name: Deploy AKS Landing Zone

on:
  push:
      branches:
            - master
              workflow_dispatch: {}

              jobs:
                deploy:
                    runs-on: ubuntu-latest
                        steps:
                              - name: Checkout repository
                                      uses: actions/checkout@v4

                                            - name: Azure Login
                                                    uses: azure/login@v1
                                                            with:
                                                                      creds: ${{ secrets.AZURE_CREDENTIALS }}

                                                                            - name: Deploy Azure Bicep
                                                                                    run: |
                                                                                              az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                                                                                                        az deployment sub create \n            --location eastus2 \n            --template-file bicep/main.bicep \n            --parameters bicep/parameters.production.json
                                                                                                        
